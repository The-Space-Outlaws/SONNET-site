      <!-- Audio Element -->
    <audio id="bg-audio" loop>
        <source src="https://cdn.jsdelivr.net/gh/The-Space-Outlaws/SONNET-site@refs/heads/main/assets/extra/music.mp3" type="audio/mpeg">
    </audio>

    <!-- Control Button -->
    <button id="toggle-btn" class="audio-toggle"> Play Music</button>

    <script>
        const audio = document.getElementById('bg-audio');
        const btn = document.getElementById('toggle-btn');

        btn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                btn.textContent = "Pause Music";
            } else {
                audio.pause();
                btn.textContent = "Play Music I Like";
            }
        });
    </script>
